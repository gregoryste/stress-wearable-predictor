services:
  api-ia:
    build:
      context: .
      dockerfile: api_ia/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
